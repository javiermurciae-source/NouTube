<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0050"/>
      <stop offset="100%" stop-color="#cc0040"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- YouTube-style rounded rectangle (TV shape) -->
  <rect x="64" y="180" width="896" height="560" rx="120" ry="120" fill="url(#red)" filter="url(#shadow)"/>
  
  <!-- Play triangle (centered, classic YouTube style) -->
  <g filter="url(#glow)">
    <polygon points="420,310 420,610 660,460" fill="white" opacity="0.97"/>
  </g>
</svg>