<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0050"/>
      <stop offset="100%" stop-color="#ff4d6d"/>
    </linearGradient>
    <linearGradient id="play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0050"/>
      <stop offset="100%" stop-color="#ff1744"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded rectangle -->
  <rect x="48" y="48" width="928" height="928" rx="200" ry="200" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- Subtle inner border -->
  <rect x="56" y="56" width="912" height="912" rx="196" ry="196" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
  
  <!-- Stylized "N" letter -->
  <g transform="translate(260, 220)" filter="url(#glow)">
    <!-- N left vertical -->
    <rect x="0" y="0" width="80" height="500" rx="16" fill="url(#accent)"/>
    <!-- N right vertical -->
    <rect x="340" y="0" width="80" height="500" rx="16" fill="url(#accent)"/>
    <!-- N diagonal -->
    <polygon points="80,0 420,500 340,500 0,0" fill="url(#accent)" opacity="0.9"/>
  </g>
  
  <!-- Play triangle overlay on the N -->
  <g transform="translate(390, 380)" filter="url(#glow)">
    <polygon points="0,0 180,130 0,260" fill="url(#play)" opacity="0.95"/>
  </g>
  
  <!-- Small decorative dots -->
  <circle cx="180" cy="180" r="12" fill="#ff0050" opacity="0.6"/>
  <circle cx="844" cy="180" r="8" fill="#ff4d6d" opacity="0.4"/>
  <circle cx="180" cy="844" r="8" fill="#ff4d6d" opacity="0.4"/>
  <circle cx="844" cy="844" r="12" fill="#ff0050" opacity="0.6"/>
  
  <!-- "Nou" text at bottom -->
  <text x="512" y="830" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="80" fill="rgba(255,255,255,0.9)" letter-spacing="4">NouTube</text>
</svg>