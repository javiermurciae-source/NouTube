name: Build PIN APK (debug)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: install and prebuild
        run: |
          bun link
          bun install --frozen-lockfile
          bun bundle:es
          bun expo prebuild -p android --clean --no-install
      - name: build debug apk
        run: ./gradlew assembleFullDebug -PreactNativeArchitectures=arm64-v8a
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: noutube-pin-debug
          path: android/app/build/outputs/apk/full/debug/*-debug.apk
